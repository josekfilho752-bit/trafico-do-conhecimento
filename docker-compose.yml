services:
  web:
    build: .
    container_name: trafico_conhecimento_web
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DB_HOST=db
      - DB_NAME=trafico_conhecimento
      - DB_USER=user_livraria
      - DB_PASS=senha_segura_123
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: trafico_conhecimento_db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: trafico_conhecimento
      MYSQL_USER: user_livraria
      MYSQL_PASSWORD: senha_segura_123
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_password_123"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: trafico_conhecimento_pma
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root_password_123
    ports:
      - "8081:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
